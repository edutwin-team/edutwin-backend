name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  DOCKER_IMAGE: mish1ma/edutwin-backend

jobs:
  # ---------------------------------------------------------
  # JOB 1 : TESTS
  # ---------------------------------------------------------
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest
    # Plus besoin du bloc env ici ! settings.py gère déjà SQLite en mémoire.
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: python manage.py test 

  # ---------------------------------------------------------
  # JOB 2 : BUILD & PUSH
  # ---------------------------------------------------------
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' 

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set Docker Tag
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "TAG=latest" >> $GITHUB_ENV
        else
          echo "TAG=dev" >> $GITHUB_ENV
        fi

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.DOCKER_IMAGE }}:${{ env.TAG }}

  # ---------------------------------------------------------
  # JOB 3 : DEPLOY
  # ---------------------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
    - name: Deploy to PROD (Render)
      if: github.ref == 'refs/heads/main'
      env:
        DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
      run: curl "$DEPLOY_HOOK"

    - name: Deploy to DEV (Render)
      if: github.ref == 'refs/heads/develop'
      env:
        DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}
      run: curl "$DEPLOY_HOOK"

name: Django CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Annule les runs redondants sur une même PR (économise des minutes CI)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKER_IMAGE: mish1ma/edutwin-backend
  PYTHON_VERSION: "3.14"

jobs:
  # ---------------------------------------------------------
  # JOB 1 : QUALITÉ (rapide, fail-fast)
  # ---------------------------------------------------------
  quality:
    name: Lint & Migrations check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Détecter les migrations manquantes
        run: python manage.py makemigrations --check --dry-run

      - name: Type check (mypy)
        run: mypy . --ignore-missing-imports
        continue-on-error: true # passe en `false` quand la base est propre

  # ---------------------------------------------------------
  # JOB 2 : TESTS  (settings.py bascule sur SQLite via GITHUB_ACTIONS=true)
  # ---------------------------------------------------------
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - run: pip install -r requirements.txt

      # user/test.py + */tests.py : on force les 2 patterns
      - name: Run Tests
        run: |
          python manage.py test -v 2 --pattern="test*.py"

  # ---------------------------------------------------------
  # JOB 3 : BUILD & PUSH
  # ---------------------------------------------------------
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest/dev + tag SHA immuable => rollback possible
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------
  # JOB 4 : DEPLOY
  # ---------------------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    # GitHub Environments : secrets scopés + approbation manuelle possible sur prod
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Trigger Render deploy hook
        env:
          DEPLOY_HOOK: ${{ github.ref == 'refs/heads/main'
            && secrets.RENDER_DEPLOY_HOOK_PROD
            || secrets.RENDER_DEPLOY_HOOK_DEV }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo "::error::Deploy hook manquant"; exit 1; }
          curl -fsS --retry 3 --retry-delay 5 -o /dev/null -w "HTTP %{http_code}\n" "$DEPLOY_HOOK"

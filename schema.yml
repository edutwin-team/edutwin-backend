components:
  schemas:
    Answer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
          maxLength: 500
        is_correct:
          type: boolean
      required:
      - id
      - text
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
      required:
      - new_password
      - old_password
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        body:
          type: string
        is_published:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - description
      - id
      - title
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    PatchedAnswer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
          maxLength: 500
        is_correct:
          type: boolean
    PatchedCourse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        body:
          type: string
        is_published:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedQuestion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 500
        question_type:
          $ref: '#/components/schemas/QuestionTypeEnum'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
          readOnly: true
    PatchedQuiz:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        is_published:
          type: boolean
        passing_score:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        time_limit_minutes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    Question:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 500
        question_type:
          $ref: '#/components/schemas/QuestionTypeEnum'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
          readOnly: true
      required:
      - answers
      - id
      - title
    QuestionTypeEnum:
      enum:
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `1` - single_choice
        * `2` - multiple_choice
        * `3` - true_false
    Quiz:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        is_published:
          type: boolean
        passing_score:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
